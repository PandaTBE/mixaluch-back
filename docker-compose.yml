version: "3.9"

services:
  backend:
    restart: always
    build:
      context: .
    command: gunicorn core.wsgi:application -b 0.0.0.0:8080 --timeout 120 --workers 3 --max-requests 1000 --max-requests-jitter 100
    ports:
      - "8080:8080"
    volumes:
      - /var/www/persistentdata/static:/var/www/static
      - /var/www/persistentdata/media:/var/www/media
